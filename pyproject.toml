[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketpulse-ai"
version = "0.1.0"
description = "Historical multi-timeframe market data and SMC zone detection toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "MarketPulse AI Project"}]
dependencies = [
  "pandas>=2.2,<4.0",
  "numpy>=1.26,<3.0",
  "yfinance>=0.2.60",
  "ccxt>=4.4",
  "PyYAML>=6.0",
  "requests>=2.31",
  "streamlit>=1.37",
  "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
marketpulse = "marketpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
